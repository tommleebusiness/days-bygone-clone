plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tommlee.daysbygone'
    compileSdk 34

    defaultConfig {
        applicationId "com.tommlee.daysbygone"
        minSdk 24
        targetSdk 34
        versionCode 16
        versionName "3.2"
    }

    signingConfigs {
        release {
            // ключ лежит рядом с проектом (в git не попадает)
            storeFile file("../daysbygone.keystore")
            storePassword "daysbygone2026"
            keyAlias "daysbygone"
            keyPassword "daysbygone2026"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    // Внутриигровые покупки (донат)
    implementation 'com.android.billingclient:billing:6.2.1'
    // Платная реклама (баннер, межстраничная, rewarded)
    implementation 'com.google.android.gms:play-services-ads:23.3.0'
}

// Копируем игру в assets перед сборкой — единый источник правды (days-bygone-clone/game)
def gameSrc = file("../../days-bygone-clone/game")
def assetsDir = file("src/main/assets/game")

tasks.register('copyGameAssets', Copy) {
    from gameSrc
    into assetsDir
    // dev-скрипты и временные стенды в игру не кладём
    exclude '**/_*.mjs', '**/_*.py', '**/_*.js', '**/_*.html'
    exclude '**/.DS_Store', '**/Thumbs.db'
}

tasks.register('cleanGameAssets', Delete) {
    delete assetsDir
}

preBuild.dependsOn copyGameAssets
clean.dependsOn cleanGameAssets