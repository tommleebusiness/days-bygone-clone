plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tommlee.daysbygone'
    compileSdk 34

    defaultConfig {
        applicationId "com.tommlee.daysbygone"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    signingConfigs {
        release {
            // ключ лежит рядом с проектом (в git не попадает)
            storeFile file("../daysbygone.keystore")
            storePassword "daysbygone2026"
            keyAlias "daysbygone"
            keyPassword "daysbygone2026"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}

// Копируем игру в assets перед сборкой — единый источник правды (days-bygone-clone/game)
def gameSrc = file("../../days-bygone-clone/game")
def assetsDir = file("src/main/assets/game")

tasks.register('copyGameAssets', Copy) {
    from gameSrc
    into assetsDir
}

tasks.register('cleanGameAssets', Delete) {
    delete assetsDir
}

preBuild.dependsOn copyGameAssets
clean.dependsOn cleanGameAssets